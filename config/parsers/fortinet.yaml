id: "fortinet"
version: "1.0.0"
description: "Fortinet FortiGate Next-Generation Firewall Traffic Logs"

# FortiGate logs are key-value pairs with a consistent "type=traffic" field.
detection_pattern: "type=traffic"

# FortiGate key-value format: key=value pairs separated by spaces.
# Values may be quoted strings or unquoted tokens.
# This regex extracts the most common fields from traffic log lines.
regex: >-
  date=(?P<date>\S+)\s+
  time=(?P<time>\S+)\s+
  .*?devname="?(?P<devname>[^"\s]+)"?\s+
  .*?srcip=(?P<src_ip>[\d.]+)\s+
  .*?srcport=(?P<src_port>\d+)\s+
  .*?dstip=(?P<dst_ip>[\d.]+)\s+
  .*?dstport=(?P<dst_port>\d+)\s+
  .*?proto=(?P<proto>\d+)\s+
  .*?action=(?P<action_word>\S+)\s+
  .*?severity=(?P<sev>\S+)

mappings:
  action: "action_word"
  src_endpoint.ip: "src_ip"
  src_endpoint.port: "src_port"
  dst_endpoint.ip: "dst_ip"
  dst_endpoint.port: "dst_port"

# protocol in FortiGate is an IP protocol number; the normalizer maps it:
# 6 → TCP, 17 → UDP, 1 → ICMP
unmapped_captures:
  - "date"
  - "time"
  - "devname"
  - "proto"
  - "sev"

# action_map translates FortiGate action strings to OCSF action values.
action_map:
  "accept": "Allowed"
  "deny": "Denied"
  "drop": "Denied"
  "reset": "Denied"
  "close": "Teardown"

# protocol_map translates IP protocol numbers to OCSF protocol strings.
protocol_map:
  "1": "ICMP"
  "6": "TCP"
  "17": "UDP"
  "47": "GRE"
  "50": "ESP"
