version: 1
description: 'Language-neutral conformance cases for the parser DSL (contracts/parser_dsl.md). An engine passes when every case''s expect holds. python: false marks cases the sidecar''s reference evaluator does not model; they are for the Go engine only.'
cases:
- name: kv maps some keys and keeps the rest unmapped
  spec: 3 unmapped
  parser: |
    id: conf
    version: 1.0.0
    vendor: test
    product: conf
    timezone: +05:30
    match: {signature: .}
    ocsf_defaults: {class_uid: 4001, category_uid: 4}
    extractors:
    - id: e
      kind: kv
      map:
      - {from: srcip, to: src_endpoint.ip, type: ip}
      - {from: srcport, to: src_endpoint.port, type: port}
  raw: srcip=10.1.4.7 srcport=51544 user=alice action=allow
  expect:
    matched: true
    extractor: e
    ocsf: {src_endpoint.ip: 10.1.4.7, src_endpoint.port: 51544}
    unmapped: {user: alice, action: allow}
    unmapped_absent: [srcip, srcport]
  python: true
- name: a quoted kv value is never re-scanned for keys (log injection)
  spec: 2.2 kv
  parser: |
    id: conf
    version: 1.0.0
    vendor: test
    product: conf
    timezone: +05:30
    match: {signature: .}
    ocsf_defaults: {class_uid: 4001, category_uid: 4}
    extractors:
    - id: e
      kind: kv
      map:
      - {from: srcip, to: src_endpoint.ip, type: ip}
  raw: srcip=1.1.1.1 msg="hi srcip=9.9.9.9 dstip=8.8.8.8" user=bob
  expect:
    matched: true
    ocsf: {src_endpoint.ip: 1.1.1.1}
    unmapped: {msg: hi srcip=9.9.9.9 dstip=8.8.8.8, user: bob}
    unmapped_absent: [dstip]
    flags_absent: [duplicate_key]
  python: true
- name: 'a duplicate kv key: first maps, later ones go to unmapped._dupes, flag set'
  spec: 3 duplicate keys
  parser: |
    id: conf
    version: 1.0.0
    vendor: test
    product: conf
    timezone: +05:30
    match: {signature: .}
    ocsf_defaults: {class_uid: 4001, category_uid: 4}
    extractors:
    - id: e
      kind: kv
      map:
      - {from: srcip, to: src_endpoint.ip, type: ip}
  raw: srcip=1.1.1.1 x=1 srcip=6.6.6.6 y=2
  expect:
    matched: true
    ocsf: {src_endpoint.ip: 1.1.1.1}
    unmapped:
      _dupes:
      - {key: srcip, value: 6.6.6.6}
    flags: [duplicate_key]
  python: true
- name: 'an empty value is absent: no mapping, not in unmapped'
  spec: 3 empty means absent
  parser: |
    id: conf
    version: 1.0.0
    vendor: test
    product: conf
    timezone: +05:30
    match: {signature: .}
    ocsf_defaults: {class_uid: 4001, category_uid: 4}
    extractors:
    - id: e
      kind: kv
      map:
      - {from: user, to: actor.user.name, type: string}
      - {from: srcip, to: src_endpoint.ip, type: ip}
  raw: srcip=1.1.1.1 user= a=1 b=2
  expect:
    matched: true
    ocsf: {src_endpoint.ip: 1.1.1.1}
    ocsf_absent: [actor.user.name]
    unmapped_absent: [user]
  python: true
- name: enum matching is exact
  spec: 3 enum
  parser: |
    id: conf
    version: 1.0.0
    vendor: test
    product: conf
    timezone: +05:30
    match: {signature: .}
    ocsf_defaults: {class_uid: 4001, category_uid: 4}
    extractors:
    - id: e
      kind: kv
      map:
      - from: proto
        to: connection_info.protocol_num
        type: enum
        enum: {tcp: 6, udp: 17}
        default: 0
  raw: proto=tcp a=1 b=2 c=3
  expect:
    matched: true
    ocsf: {connection_info.protocol_num: 6}
  python: true
- name: 'enum is case-sensitive: TCP is not tcp, it takes the default'
  spec: 3 enum
