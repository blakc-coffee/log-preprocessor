id: cisco_asa
version: 1.0.0
vendor: cisco
product: asa
timezone: "+05:30"
match:
  signature: '%ASA-\d-\d{6}:'
ocsf_defaults: {class_uid: 4001, category_uid: 4}
extractors:
  - id: asa_302013_inbound
    kind: regex
    pattern: '^(?P<pri><\d+>)?(?P<ts>[A-Z][a-z]{2} +\d+ \d{4} [\d:]+) (?P<host>\S+) : %ASA-(?P<sev>\d)-302013: Built inbound (?P<proto>\w+) connection (?P<conn>\d+) for (?P<a_if>\w+):(?P<a_ip>[\d.]+)/(?P<a_port>\d+) \((?P<a_nat_ip>[\d.]+)/(?P<a_nat_port>\d+)\) to (?P<b_if>\w+):(?P<b_ip>[\d.]+)/(?P<b_port>\d+) \((?P<b_nat_ip>[\d.]+)/(?P<b_nat_port>\d+)\)$'
    render: '{pri}{ts} {host} : %ASA-{sev}-302013: Built inbound {proto} connection {conn} for {a_if}:{a_ip}/{a_port} ({a_nat_ip}/{a_nat_port}) to {b_if}:{b_ip}/{b_port} ({b_nat_ip}/{b_nat_port})'
    map:
      - {from: ts, to: time, type: time, layout: "Jan _2 2006 15:04:05"}
      - {from: sev, to: severity_id, type: enum, enum: {"0": 6, "1": 5, "2": 5, "3": 4, "4": 3, "5": 2, "6": 1, "7": 1}, default: 99}
      - {from: a_ip, to: src_endpoint.ip, type: ip}
      - {from: a_port, to: src_endpoint.port, type: port}
      - {from: b_ip, to: dst_endpoint.ip, type: ip}
      - {from: b_port, to: dst_endpoint.port, type: port}
      - {from: proto, to: connection_info.protocol_name, type: string, lower: true}
      - {from: proto, to: connection_info.protocol_num, type: enum, enum: {TCP: 6, UDP: 17, ICMP: 1, tcp: 6, udp: 17, icmp: 1}, default: 0}
      - {const: 1, to: activity_id}
      - {const: 1, to: action_id}
      - {const: 1, to: disposition_id}
    tests:
      - raw: '<166>Sep 28 2026 09:00:07 asa01 : %ASA-6-302013: Built inbound TCP connection 1005 for outside:192.0.2.179/22 (192.0.2.179/22) to inside:10.1.11.225/56376 (10.1.11.225/56376)'
        expect: {src_endpoint.ip: 192.0.2.179, src_endpoint.port: 22, dst_endpoint.ip: 10.1.11.225, dst_endpoint.port: 56376, connection_info.protocol_num: 6}
  - id: asa_302013_outbound
