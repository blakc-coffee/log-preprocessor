id: "suricata"
version: "1.0.0"
description: "Suricata IDS/IPS EVE JSON Log Format"

# Suricata EVE JSON always starts with {"timestamp": and contains "event_type".
# We target alert and flow event types for network normalization.
detection_pattern: "\"event_type\":"

# Suricata EVE JSON is newline-delimited JSON (one object per line).
# We extract fields using regex over the JSON string rather than parsing JSON,
# to maintain compatibility with the Go regexp engine and the declarative DSL.
# This approach works because EVE JSON field ordering is consistent.
regex: >-
  "timestamp":"(?P<ts>[^"]+)".*?
  "event_type":"(?P<event_type>[^"]+)".*?
  "src_ip":"(?P<src_ip>[^"]+)".*?
  "src_port":(?P<src_port>\d+).*?
  "dest_ip":"(?P<dst_ip>[^"]+)".*?
  "dest_port":(?P<dst_port>\d+).*?
  "proto":"(?P<proto>[^"]+)"
  (?:.*?"alert":\{.*?"signature":"(?P<signature>[^"]+)".*?"severity":(?P<sev>\d+))?

mappings:
  action: "event_type"
  src_endpoint.ip: "src_ip"
  src_endpoint.port: "src_port"
  dst_endpoint.ip: "dst_ip"
  dst_endpoint.port: "dst_port"
  protocol: "proto"

unmapped_captures:
  - "ts"
  - "signature"
  - "sev"
  # event_type is mapped to action via action_map below

# Suricata alert severity: 1=high, 2=medium, 3=low (inverted from most systems)
severity_map:
  "1": "High"
  "2": "Medium"
  "3": "Low"

# Suricata action is inferred from event_type:
# "alert" → Alert, "flow" → Informational (state-based, not block/allow per se)
action_map:
  "alert": "Alert"
  "flow": "Informational"
  "dns": "Informational"
  "tls": "Informational"
  "http": "Informational"
