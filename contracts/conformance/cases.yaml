- name: 'json: dotted paths map, nested leftovers stay unmapped under their path'
  spec: 2.3 json
  parser: |
    id: conf
    version: 1.0.0
    vendor: test
    product: conf
    timezone: +05:30
    match: {signature: .}
    ocsf_defaults: {class_uid: 4001, category_uid: 4}
    extractors:
    - id: e
      kind: json
      when: {path: event_type, equals: alert}
      map:
      - {from: src_ip, to: src_endpoint.ip, type: ip}
      - {from: alert.severity, to: severity_id, type: int}
  raw: '{"event_type":"alert","src_ip":"10.0.0.1","alert":{"severity":2,"signature":"x"}}'
  expect:
    matched: true
    ocsf: {src_endpoint.ip: 10.0.0.1, severity_id: 2}
