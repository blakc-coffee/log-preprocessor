      map:
      - {const: 6, to: activity_id}
  raw: a=1 b=2 c=3 d=4
  expect:
    matched: true
    ocsf: {activity_id: 6, class_uid: 4001, category_uid: 4}
  python: true
- name: the first extractor to succeed wins
  spec: 2 extractors
  parser: |
    id: conf
    version: 1.0.0
    vendor: test
    product: conf
    timezone: +05:30
    match: {signature: .}
    ocsf_defaults: {class_uid: 4001, category_uid: 4}
    extractors:
    - id: first
      kind: regex
      pattern: ^A (?P<x>\d+)$
      map:
      - {from: x, to: src_endpoint.port, type: port}
    - id: second
      kind: regex
      pattern: ^A (?P<y>\d+)$
      map:
      - {from: y, to: dst_endpoint.port, type: port}
    - id: third
      kind: regex
      pattern: ^B (?P<z>\d+)$
      map:
      - {from: z, to: dst_endpoint.port, type: port}
  raw: A 80
  expect:
    matched: true
    extractor: first
    ocsf: {src_endpoint.port: 80}
    ocsf_absent: [dst_endpoint.port]
  python: true
- name: a later extractor is used when the earlier ones do not match
  spec: 2 extractors
  parser: |
    id: conf
    version: 1.0.0
    vendor: test
    product: conf
    timezone: +05:30
    match: {signature: .}
    ocsf_defaults: {class_uid: 4001, category_uid: 4}
    extractors:
    - id: first
      kind: regex
      pattern: ^A (?P<x>\d+)$
      map:
      - {from: x, to: src_endpoint.port, type: port}
    - id: second
      kind: regex
      pattern: ^A (?P<y>\d+)$
      map:
      - {from: y, to: dst_endpoint.port, type: port}
    - id: third
      kind: regex
      pattern: ^B (?P<z>\d+)$
      map:
      - {from: z, to: dst_endpoint.port, type: port}
  raw: B 443
  expect:
    matched: true
    extractor: third
    ocsf: {dst_endpoint.port: 443}
  python: true
- name: 'no extractor matches: the record is quarantined'
  spec: 2 extractors
  parser: |
    id: conf
    version: 1.0.0
    vendor: test
    product: conf
    timezone: +05:30
    match: {signature: .}
    ocsf_defaults: {class_uid: 4001, category_uid: 4}
    extractors:
