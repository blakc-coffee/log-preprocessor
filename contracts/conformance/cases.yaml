        enum: {tcp: 6, udp: 17}
        default: 0
  raw: proto=TCP a=1 b=2 c=3
  expect:
    matched: true
    ocsf: {connection_info.protocol_num: 0}
  python: true
- name: const entries set their target
  spec: 3 map
  parser: |
