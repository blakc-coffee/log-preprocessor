- name: 'identity block: a DHCP ACK produces a bind fact'
  spec: 6 identity
  parser: |
    id: conf
    version: 1.0.0
    vendor: test
    product: conf
    timezone: +05:30
    match: {signature: .}
    ocsf_defaults: {class_uid: 4001, category_uid: 4}
