[project]
name = "sluice-intel"
version = "0.1.0"
description = "Sluice intelligence sidecar: drift detection, semantic typing, parser proposals. Propose-only, off the hot path."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.13,<3",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.26,<5",
  "drain3>=0.9.1,<1",
  "cachetools>=5,<7",  # drain3 imports it but does not declare it
  "httpx>=0.28,<1",
]

[project.urls]
Homepage = "https://github.com/dark-14100/sluice"
Source = "https://github.com/dark-14100/sluice"

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ulpf_intel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
