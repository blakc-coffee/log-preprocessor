id: isc_dhcpd
version: 1.0.0
vendor: isc
product: dhcpd
timezone: "+05:30"
match:
  signature: 'dhcpd\[\d+\]: DHCP(?:ACK|RELEASE)'
ocsf_defaults: {class_uid: 4004, category_uid: 4}
extractors:
  - id: dhcp_lease
    kind: regex
    pattern: '^(?P<ts>[A-Z][a-z]{2} +\d+ [\d:]+) (?P<host>\S+) dhcpd\[(?P<pid>\d+)\]: (?P<msgtype>DHCPACK|DHCPRELEASE) (?P<of>on|of) (?P<ip>[\d.]+) (?P<prep>to|from) (?P<mac>[0-9a-f:]{17}) \((?P<hostname>[^)]*)\) via (?P<iface>\S+)(?P<note>(?: \([^)]*\))?)$'
    render: '{ts} {host} dhcpd[{pid}]: {msgtype} {of} {ip} {prep} {mac} ({hostname}) via {iface}{note}'
    map:
      - {from: ts, to: time, type: time, layout: "Jan _2 15:04:05"}
      - {from: ip, to: src_endpoint.ip, type: ip}
      - {from: mac, to: src_endpoint.mac, type: mac}
      - {from: hostname, to: src_endpoint.hostname, type: string}
      - {const: 1, to: severity_id}
      - {from: msgtype, to: activity_id, type: enum, enum: {DHCPACK: 5, DHCPRELEASE: 7}, default: 99}
    tests:
      - raw: 'Sep 28 09:01:14 dhcp01 dhcpd[1123]: DHCPACK on 10.1.4.9 to aa:bb:cc:8a:06:2d (laptop-carol) via eth1'
        expect: {src_endpoint.ip: 10.1.4.9, src_endpoint.mac: 'aa:bb:cc:8a:06:2d', src_endpoint.hostname: laptop-carol, activity_id: 5}
identity:
  kind: dhcp
  when: {field: msgtype, in: [DHCPACK, DHCPRELEASE]}
  action: {field: msgtype, enum: {DHCPACK: bind, DHCPRELEASE: release}}
  ip: ip
  mac: mac
  host: hostname
  at: ts
