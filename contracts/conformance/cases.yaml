      map:
      - {from: ts, to: time, type: time, layout: 'Jan _2 15:04:05'}
      - {from: ip, to: src_endpoint.ip, type: ip}
  raw: Sep 28 09:00:00 fw01 10.0.0.1
  received_at: '2026-09-28T04:00:00Z'
  expect:
    matched: true
    ocsf: {src_endpoint.ip: 10.0.0.1}
    unmapped: {host: fw01}
