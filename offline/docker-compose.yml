# Offline install: images come from `docker load`, nothing is built or pulled.
# ULPF_TAG is read from ./.env (written by `make bundle`).
services:
  sluice:
    image: sluice:${ULPF_TAG}
    pull_policy: never
    command: ["all", "--config", "/etc/sluice/config.yaml"]
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    volumes:
      - sluice-data:/data
      - ./configs/demo.yaml:/etc/sluice/config.yaml:ro
      - ./configs/ingest.container.yaml:/etc/sluice/ingest.yaml:ro
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:5514:5514/tcp"
      - "127.0.0.1:5514:5514/udp"
      - "127.0.0.1:8080:8080"

  intel:
    image: sluice-intel:${ULPF_TAG}
    pull_policy: never
    depends_on:
      sluice:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    volumes:
      - sluice-data-intel:/state
    network_mode: "service:sluice"

volumes:
  sluice-data: {}
  sluice-data-intel: {}
