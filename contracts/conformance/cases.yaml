      kind: regex
      pattern: ^A (?P<x>\d+)$
      map:
      - {from: x, to: src_endpoint.port, type: port}
    - id: second
      kind: regex
      pattern: ^A (?P<y>\d+)$
      map:
      - {from: y, to: dst_endpoint.port, type: port}
    - id: third
      kind: regex
      pattern: ^B (?P<z>\d+)$
      map:
      - {from: z, to: dst_endpoint.port, type: port}
  raw: C 1
  expect: {matched: false}
  python: true
- name: 'csv: named columns map, others are kept as col_N'
  spec: 2.4 csv
  parser: |
    id: conf
    version: 1.0.0
    vendor: test
    product: conf
    timezone: +05:30
    match: {signature: .}
    ocsf_defaults: {class_uid: 4001, category_uid: 4}
    extractors:
    - id: e
      kind: csv
      sep: ','
      quote: '"'
      min_columns: 5
      when: {column: 1, equals: TRAFFIC}
      columns: [_, _, src_ip, dst_ip, _]
      map:
      - {from: src_ip, to: src_endpoint.ip, type: ip}
      - {from: dst_ip, to: dst_endpoint.ip, type: ip}
  raw: ',TRAFFIC,10.0.0.1,10.0.0.2,extra,tail'
  expect:
    matched: true
    ocsf: {src_endpoint.ip: 10.0.0.1, dst_endpoint.ip: 10.0.0.2}
    unmapped: {col_5: tail}
  python: true
