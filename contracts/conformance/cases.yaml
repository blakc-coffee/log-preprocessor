    - id: e
      kind: regex
      pattern: ^(?P<msgtype>DHCPACK|DHCPRELEASE) (?P<ip>[\d.]+) (?P<mac>\S+) (?P<hostname>\S+)$
      map:
      - {from: ip, to: src_endpoint.ip, type: ip}
    identity:
      kind: dhcp
      when:
        field: msgtype
        in: [DHCPACK, DHCPRELEASE]
      action:
        field: msgtype
        enum: {DHCPACK: bind, DHCPRELEASE: release}
      ip: ip
      mac: mac
      host: hostname
      at: ts
