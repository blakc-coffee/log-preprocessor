services:
  sluice:
    build:
      context: .
      target: sluice
    image: sluice:${ULPF_TAG:-dev}
    command: ["all", "--config", "/etc/sluice/config.yaml"]
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    volumes:
      - sluice-data:/data
      - ./configs/demo.yaml:/etc/sluice/config.yaml:ro
      - ./configs/ingest.container.yaml:/etc/sluice/ingest.yaml:ro
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:5514:5514/tcp"
      - "127.0.0.1:5514:5514/udp"
      - "127.0.0.1:8080:8080"
    networks: [sluice_internal]

  intel:
    build:
      context: .
      target: intel
    image: sluice-intel:${ULPF_TAG:-dev}
    depends_on:
      sluice:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    volumes:
      - sluice-data-intel:/state
    # Same network namespace as sluice: the admin API is on that loopback only.
    network_mode: "service:sluice"

volumes:
  sluice-data: {}
  sluice-data-intel: {}

networks:
  sluice_internal:
    driver: bridge
    # Not internal: Docker cannot publish a port from an internal network, so the
    # UI would be unreachable. Ports are published on the host's loopback only,
    # and the image contains no outbound code (scripts/verify_airgap.sh proves it
    # with --network none and on an internal network).

